<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейные фото</title>
    <!-- Tailwind CSS через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F8F7FA;
            color: #2D2625;
        }
        input, button {
            font-size: 1.1rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-purple-200">

    <!-- Шапка приложения -->
    <header class="bg-[#4A3324] text-white shadow-lg sticky top-0 z-30 border-b-4 border-[#3178C6]">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            
            <!-- Кнопка Домой и Заголовок -->
            <div class="flex items-center gap-4">
                <button id="home-btn" onclick="goHome()" class="flex items-center gap-2 bg-[#1E56A0] hover:bg-[#164380] text-white px-5 py-3 rounded-xl transition cursor-pointer shadow-md font-semibold text-lg border border-blue-400">
                    <!-- SVG Домик -->
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span id="txt-home">На главную</span>
                </button>
                <h1 id="app-title" class="text-2xl md:text-3xl font-bold tracking-wide text-[#EBE5F5]">Семейные фото</h1>
            </div>

            <!-- Управление: Поиск, Загрузки, Язык -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <!-- Поиск -->
                <div class="relative flex-1 md:w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-purple-200">
                        <!-- SVG Лупа -->
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </span>
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Поиск..." class="w-full pl-10 pr-4 py-3 bg-[#3A261C] border border-[#6B5344] rounded-xl text-white placeholder-purple-200/70 focus:outline-none focus:ring-2 focus:ring-[#7B68EE]">
                </div>

                <!-- Кнопка загрузки папок -->
                <label class="flex items-center gap-2 bg-[#1E56A0] hover:bg-[#164380] text-white px-4 py-3 rounded-xl cursor-pointer shadow-md transition font-semibold text-lg border border-blue-400">
                    <!-- SVG Папки -->
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                    <span id="txt-upload-folders">Загрузить папки</span>
                    <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden" onchange="handleFolderUpload(event)">
                </label>

                <!-- Кнопка загрузки отдельных файлов -->
                <label class="flex items-center gap-2 bg-[#5A4573] hover:bg-[#48375C] text-white px-4 py-3 rounded-xl cursor-pointer shadow-md transition font-semibold text-lg border border-purple-400">
                    <!-- SVG Файлы -->
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    <span id="txt-upload-files">Файлы</span>
                    <input type="file" id="file-input" multiple class="hidden" onchange="handleFilesUpload(event)">
                </label>

                <!-- Переключатель языка -->
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-[#3A261C] border border-[#6B5344] text-white px-3 py-3 rounded-xl focus:outline-none cursor-pointer font-medium">
                    <option value="ru" class="bg-[#4A3324] text-white">RU</option>
                    <option value="de" class="bg-[#4A3324] text-white">DE</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Модальное окно прогресса загрузки -->
    <div id="progress-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-full shadow-2xl border border-purple-200">
            <h3 id="prog-title" class="text-xl font-bold mb-3 text-[#4A3324]">Идет загрузка файлов...</h3>
            <p id="prog-text" class="text-stone-600 mb-4 text-lg">Обработано файлов: 0 из 0</p>
            <div class="w-full bg-purple-100 rounded-full h-5 overflow-hidden mb-4">
                <div id="prog-bar" class="bg-[#1E56A0] h-full w-0 transition-all duration-300"></div>
            </div>
            <p class="text-sm text-stone-500 text-center" id="prog-sub">Пожалуйста, не закрывайте вкладку...</p>
        </div>
    </div>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Заголовок раздела -->
        <div id="section-header" class="mb-6 flex justify-between items-center border-b border-purple-200 pb-3">
            <h2 id="current-section-title" class="text-3xl font-bold text-[#4A3324]">Все альбомы и папки</h2>
        </div>

        <!-- Сетка папок / файлов -->
        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Динамический контент -->
        </div>

        <!-- Заглушка пустого состояния -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <svg class="w-24 h-24 text-purple-300 mb-4 fill-current" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
            <p id="empty-text" class="text-2xl text-stone-600 font-medium">Архив пока пуст. Загрузите папки или файлы!</p>
        </div>
    </main>

    <!-- Модальный плеер / просмотрщик -->
    <div id="media-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeMediaModal()" class="absolute top-5 right-5 text-white bg-[#4A3324] hover:bg-[#3A261C] p-3 rounded-full transition shadow-lg cursor-pointer border border-purple-300">
            <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <div id="media-container" class="max-w-5xl max-h-[85vh] w-full flex items-center justify-center overflow-hidden rounded-2xl"></div>
        <div id="media-title" class="text-purple-100 mt-4 text-xl font-medium tracking-wide text-center"></div>
    </div>

    <!-- Футер -->
    <footer class="bg-[#EBE5F5] text-[#4A3324] py-6 text-center border-t border-purple-200 mt-auto font-medium">
        <p id="footer-text">Семейные фото. Работает локально и безопасно на вашем устройстве.</p>
    </footer>

    <!-- Скрипт приложения -->
    <script>
        const i18n = {
            ru: {
                home: "На главную",
                title: "Семейные фото",
                uploadFolders: "Загрузить папки",
                uploadFiles: "Файлы",
                searchPlaceholder: "Поиск...",
                empty: "Архив пока пуст. Загрузите папки или файлы!",
                allFolders: "Все альбомы и папки",
                filesCount: "файлов",
                deleteFolderConfirm: "Вы уверены, что хотите удалить эту папку вместе с файлами?",
                deleteFileConfirm: "Удалить этот файл?",
                editFolderPrompt: "Введите новое название альбома:",
                editFilePrompt: "Введите новое имя файла:",
                loadingTitle: "Идет загрузка файлов...",
                loadingProgress: "Обработано файлов:",
                loadingSub: "Пожалуйста, не закрывайте вкладку...",
                footer: "Семейные фото. Работает локально и безопасно на вашем устройстве."
            },
            de: {
                home: "Startseite",
                title: "Familienfotos",
                uploadFolders: "Ordner hochladen",
                uploadFiles: "Dateien",
                searchPlaceholder: "Suche...",
                empty: "Das Archiv ist noch leer. Laden Sie Ordner oder Dateien hoch!",
                allFolders: "Alle Alben und Ordner",
                filesCount: "Dateien",
                deleteFolderConfirm: "Möchten Sie diesen Ordner und alle darin enthaltenen Dateien wirklich löschen?",
                deleteFileConfirm: "Diese Datei löschen?",
                editFolderPrompt: "Geben Sie einen neuen Albumnamen ein:",
                editFilePrompt: "Geben Sie einen neuen Dateinamen ein:",
                loadingTitle: "Dateien werden geladen...",
                loadingProgress: "Verarbeitete Dateien:",
                loadingSub: "Bitte schließen Sie den Tab nicht...",
                footer: "Familienfotos. Läuft lokal und sicher auf Ihrem Gerät."
            }
        };

        let currentLang = 'ru';

        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('txt-home').innerText = i18n[lang].home;
            document.getElementById('app-title').innerText = i18n[lang].title;
            document.getElementById('txt-upload-folders').innerText = i18n[lang].uploadFolders;
            document.getElementById('txt-upload-files').innerText = i18n[lang].uploadFiles;
            document.getElementById('search-input').placeholder = i18n[lang].searchPlaceholder;
            document.getElementById('empty-text').innerText = i18n[lang].empty;
            document.getElementById('prog-title').innerText = i18n[lang].loadingTitle;
            document.getElementById('prog-sub').innerText = i18n[lang].loadingSub;
            document.getElementById('footer-text').innerText = i18n[lang].footer;
            
            if (currentFolderId === null) {
                document.getElementById('current-section-title').innerText = i18n[lang].allFolders;
            }
            render();
        }

        let db;
        const DB_NAME = 'FamilyPhotosDB';
        const DB_VERSION = 1;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains('folders')) {
                        database.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!database.objectStoreNames.contains('files')) {
                        const fileStore = database.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
                        fileStore.createIndex('folderId', 'folderId', { unique: false });
                    }
                };
            });
        }

        let currentFolderId = null;
        let searchQuery = '';
        let cachedFolders = [];
        let cachedFiles = [];

        function extractYear(name) {
            const match = name.match(/(19\d{2}|20\d{2})/);
            return match ? match[0] : 'Общий';
        }

        function getMediaType(file) {
            const mime = file.type || '';
            const name = file.name.toLowerCase();

            if (mime.startsWith('image/') || /\.(jpg|jpeg|png|webp|gif|heic|bmp)$/.test(name)) return 'image';
            if (mime.startsWith('video/') || /\.(mp4|mov|avi|mkv|webm|m4v|mpg|mpeg)$/.test(name)) return 'video';
            if (mime.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac)$/.test(name)) return 'audio';
            return null;
        }

        async function handleFolderUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const folderMap = new Map();
            
            for (let file of files) {
                const type = getMediaType(file);
                if (!type) continue;

                let folderPath = "Мои фото";
                if (file.webkitRelativePath) {
                    const parts = file.webkitRelativePath.split('/');
                    if (parts.length > 1) {
                        parts.pop();
                        folderPath = parts.join(' / ');
                    }
                }

                if (!folderMap.has(folderPath)) {
                    folderMap.set(folderPath, []);
                }
                folderMap.get(folderPath).push({ file, type });
            }

            const modal = document.getElementById('progress-modal');
            const progBar = document.getElementById('prog-bar');
            const progText = document.getElementById('prog-text');
            modal.classList.remove('hidden');

            const totalEntries = Array.from(folderMap.values()).reduce((acc, curr) => acc + curr.length, 0);
            let processed = 0;

            for (let [folderPath, fileList] of folderMap.entries()) {
                const folderName = folderPath.split(' / ').pop();
                const folderYear = extractYear(folderPath);
                const folderId = await dbAddFolder({ name: folderName, year: folderYear, path: folderPath, customCoverBlob: null });

                const batchSize = 10;
                for (let i = 0; i < fileList.length; i += batchSize) {
                    const chunk = fileList.slice(i, i + batchSize);

                    await Promise.all(chunk.map(item => {
                        return new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = async function(e) {
                                try {
                                    const blob = new Blob([e.target.result], { type: item.file.type || 'application/octet-stream' });
                                    await dbAddFile({
                                        folderId: folderId,
                                        name: item.file.name,
                                        type: item.type,
                                        blob: blob,
                                        year: folderYear,
                                        size: item.file.size
                                    });
                                } catch (err) {
                                    console.error("Ошибка сохранения файла:", item.file.name, err);
                                }
                                processed++;
                                resolve();
                            };
                            reader.onerror = () => { processed++; resolve(); };
                            reader.readAsArrayBuffer(item.file);
                        });
                    }));

                    const percent = totalEntries > 0 ? Math.round((processed / totalEntries) * 100) : 100;
                    progBar.style.width = percent + '%';
                    progText.innerText = `${i18n[currentLang].loadingProgress} ${processed} из ${totalEntries} (${percent}%)`;
                    await new Promise(r => setTimeout(r, 10));
                }
            }

            modal.classList.add('hidden');
            progBar.style.width = '0%';
            event.target.value = '';
            await loadData();
        }

        async function handleFilesUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const modal = document.getElementById('progress-modal');
            const progBar = document.getElementById('prog-bar');
            const progText = document.getElementById('prog-text');
            modal.classList.remove('hidden');

            let folders = await dbGetAll('folders');
            let targetFolder = folders.find(f => f.name === "Разное" || f.name === "Einzelne Dateien");
            let folderId;

            if (!targetFolder) {
                folderId = await dbAddFolder({ name: currentLang === 'de' ? "Einzelne Dateien" : "Разное", year: "Общий", path: "Разное", customCoverBlob: null });
            } else {
                folderId = targetFolder.id;
            }

            const totalFiles = files.length;
            let processed = 0;
            const batchSize = 10;

            for (let i = 0; i < totalFiles; i += batchSize) {
                const chunk = Array.from(files).slice(i, i + batchSize);

                await Promise.all(chunk.map(file => {
                    return new Promise((resolve) => {
                        const type = getMediaType(file);
                        if (!type) { processed++; resolve(); return; }

                        const reader = new FileReader();
                        reader.onload = async function(e) {
                            try {
                                const blob = new Blob([e.target.result], { type: file.type || 'application/octet-stream' });
                                await dbAddFile({
                                    folderId: folderId,
                                    name: file.name,
                                    type: type,
                                    blob: blob,
                                    year: extractYear(file.name),
                                    size: file.size
                                });
                            } catch (err) {
                                console.error("Ошибка сохранения файла:", file.name, err);
                            }
                            processed++;
                            resolve();
                        };
                        reader.onerror = () => { processed++; resolve(); };
                        reader.readAsArrayBuffer(file);
                    });
                }));

                const percent = Math.round((processed / totalFiles) * 100);
                progBar.style.width = percent + '%';
                progText.innerText = `${i18n[currentLang].loadingProgress} ${processed} из ${totalFiles} (${percent}%)`;
                await new Promise(r => setTimeout(r, 10));
            }

            modal.classList.add('hidden');
            progBar.style.width = '0%';
            event.target.value = '';
            await loadData();
        }

        function dbAddFolder(folder) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['folders'], 'readwrite');
                const store = transaction.objectStore('folders');
                const request = store.add(folder);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function dbAddFile(fileObj) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['files'], 'readwrite');
                const store = transaction.objectStore('files');
                const request = store.add(fileObj);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function loadData() {
            cachedFolders = await dbGetAll('folders');
            cachedFiles = await dbGetAll('files');
            render();
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // 1. Функция изменения НАЗВАНИЯ папки
        async function editFolder(folderId, event) {
            event.stopPropagation();
            const folder = cachedFolders.find(f => f.id === folderId);
            if (!folder) return;

            const newName = prompt(i18n[currentLang].editFolderPrompt, folder.name);
            if (!newName || newName.trim() === "") return;

            folder.name = newName.trim();
            folder.year = extractYear(folder.name);

            const tx = db.transaction(['folders'], 'readwrite');
            tx.objectStore('folders').put(folder);
            tx.oncomplete = async () => {
                await loadData();
            };
        }

        // 2. Функция изменения ФОТО (ОБЛОЖКИ) папки
        function changeFolderCover(folderId, event) {
            event.stopPropagation();
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async function(evt) {
                    const blob = new Blob([evt.target.result], { type: file.type });
                    const folder = cachedFolders.find(f => f.id === folderId);
                    if (folder) {
                        folder.customCoverBlob = blob;
                        const tx = db.transaction(['folders'], 'readwrite');
                        tx.objectStore('folders').put(folder);
                        tx.oncomplete = async () => {
                            await loadData();
                        };
                    }
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        }

        // 3. Функция изменения ИМЕНИ файла
        async function editFile(fileId, event) {
            event.stopPropagation();
            const fileItem = cachedFiles.find(f => f.id === fileId);
            if (!fileItem) return;

            const newName = prompt(i18n[currentLang].editFilePrompt, fileItem.name);
            if (!newName || newName.trim() === "") return;

            fileItem.name = newName.trim();

            const tx = db.transaction(['files'], 'readwrite');
            tx.objectStore('files').put(fileItem);
            tx.oncomplete = async () => {
                await loadData();
            };
        }

        async function deleteFolder(folderId) {
            if (!confirm(i18n[currentLang].deleteFolderConfirm)) return;
            
            const filesToDelete = cachedFiles.filter(f => f.folderId === folderId);
            const tx = db.transaction(['folders', 'files'], 'readwrite');
            
            tx.objectStore('folders').delete(folderId);
            const fileStore = tx.objectStore('files');
            filesToDelete.forEach(f => fileStore.delete(f.id));

            tx.oncomplete = async () => {
                currentFolderId = null;
                await loadData();
            };
        }

        async function deleteFile(fileId, event) {
            event.stopPropagation();
            if (!confirm(i18n[currentLang].deleteFileConfirm)) return;

            const tx = db.transaction(['files'], 'readwrite');
            tx.objectStore('files').delete(fileId);
            tx.oncomplete = async () => {
                await loadData();
            };
        }

        function render() {
            const container = document.getElementById('grid-container');
            const emptyState = document.getElementById('empty-state');
            const titleEl = document.getElementById('current-section-title');
            container.innerHTML = '';

            let filteredFolders = cachedFolders;
            let filteredFiles = cachedFiles;

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filteredFolders = cachedFolders.filter(f => f.name.toLowerCase().includes(q) || f.year.toLowerCase().includes(q));
                filteredFiles = cachedFiles.filter(f => f.name.toLowerCase().includes(q) || f.year.toLowerCase().includes(q));
            }

            if (currentFolderId === null && searchQuery.trim() === '') {
                titleEl.innerText = i18n[currentLang].allFolders;
                
                if (cachedFolders.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                cachedFolders.forEach(folder => {
                    const folderFiles = cachedFiles.filter(f => f.folderId === folder.id);
                    let coverHtml = '';
                    
                    // Проверяем, есть ли пользовательская обложка
                    if (folder.customCoverBlob) {
                        const coverUrl = URL.createObjectURL(folder.customCoverBlob);
                        coverHtml = `<img src="${coverUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="Cover">`;
                    } else {
                        // Ищем фото внутри папки
                        const coverFile = folderFiles.find(f => f.type === 'image');
                        if (coverFile) {
                            const coverUrl = URL.createObjectURL(coverFile.blob);
                            coverHtml = `<img src="${coverUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="Cover">`;
                        }
                    }

                    if (!coverHtml) {
                        coverHtml = `
                            <div class="w-full h-full bg-[#2D2625] flex flex-col items-center justify-center text-white">
                                <div class="bg-[#1E56A0] p-4 rounded-full shadow-lg mb-2 border border-blue-400">
                                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                                </div>
                                <span class="text-xs font-semibold text-purple-200">Альбом папки</span>
                            </div>`;
                    }

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-md hover:shadow-xl transition overflow-hidden border border-purple-200 flex flex-col cursor-pointer group";
                    card.onclick = () => openFolder(folder.id, folder.name);

                    card.innerHTML = `
                        <div class="h-48 bg-[#F3EEF9] relative overflow-hidden flex items-center justify-center">
                            ${coverHtml}
                            <span class="absolute top-3 right-3 bg-[#EBE5F5] text-[#4A3575] border border-[#D0C2E8] text-sm font-bold px-3 py-1 rounded-full shadow">
                                ${folder.year}
                            </span>
                        </div>
                        <div class="p-5 flex flex-col flex-grow justify-between bg-white">
                            <div>
                                <h3 class="text-xl font-bold text-[#4A3324] truncate mb-1" title="${folder.name}">${folder.name}</h3>
                                <p class="text-stone-500 text-sm font-medium">${folderFiles.length} ${i18n[currentLang].filesCount}</p>
                            </div>
                            <div class="mt-4 flex items-center justify-between pt-2 border-t border-purple-100">
                                <div class="flex items-center gap-1">
                                    <!-- Отдельная кнопка: Сменить обложку (фото) папки -->
                                    <button onclick="changeFolderCover(${folder.id}, event)" class="flex items-center gap-1 text-xs bg-purple-100 hover:bg-purple-200 text-[#4A3575] font-semibold px-2.5 py-1.5 rounded-lg transition border border-purple-300" title="Загрузить фото для обложки">
                                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                                        <span>Обложка</span>
                                    </button>
                                    <!-- Отдельная кнопка: Изменить название папки -->
                                    <button onclick="editFolder(${folder.id}, event)" class="flex items-center gap-1 text-xs bg-blue-50 hover:bg-blue-100 text-[#1E56A0] font-semibold px-2.5 py-1.5 rounded-lg transition border border-blue-200" title="Изменить название папки">
                                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                        <span>Имя</span>
                                    </button>
                                </div>
                                <button onclick="deleteFolder(${folder.id})" class="text-stone-400 hover:text-red-600 p-1.5 rounded-lg transition" title="Удалить папку">
                                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } else {
                if (currentFolderId !== null) {
                    const currentFolder = cachedFolders.find(f => f.id === currentFolderId);
                    if (currentFolder) titleEl.innerText = currentFolder.name;
                } else {
                    titleEl.innerText = "Результаты поиска";
                }

                const filesToShow = currentFolderId !== null 
                    ? cachedFiles.filter(f => f.folderId === currentFolderId)
                    : filteredFiles;

                if (filesToShow.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                filesToShow.forEach(file => {
                    const fileUrl = URL.createObjectURL(file.blob);
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-md hover:shadow-xl transition overflow-hidden border border-purple-200 flex flex-col group";

                    let previewHtml = '';
                    if (file.type === 'image') {
                        previewHtml = `<img src="${fileUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300 cursor-pointer" onclick="openMedia('${file.type}', '${fileUrl}', '${file.name}')">`;
                    } else if (file.type === 'video') {
                        previewHtml = `
                            <div class="relative w-full h-full bg-[#1A1A1A] cursor-pointer flex items-center justify-center group" onclick="openMedia('${file.type}', '${fileUrl}', '${file.name}')">
                                <div class="bg-[#1E56A0] text-white p-4 rounded-full shadow-lg group-hover:scale-110 transition border border-blue-400 z-10">
                                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </div>
                                <div class="absolute bottom-2 left-2 text-xs text-purple-200 bg-black/60 px-2 py-1 rounded">Видеофайл</div>
                            </div>`;
                    } else if (file.type === 'audio') {
                        previewHtml = `
                            <div class="w-full h-full bg-[#EBE5F5] flex flex-col items-center justify-center p-4 cursor-pointer" onclick="openMedia('${file.type}', '${fileUrl}', '${file.name}')">
                                <div class="bg-[#4A3575] text-white p-4 rounded-full shadow-md mb-2">
                                    <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                                </div>
                                <span class="text-xs font-bold text-[#4A3575]">Аудиозапись</span>
                            </div>`;
                    }

                    card.innerHTML = `
                        <div class="h-48 relative overflow-hidden bg-[#F3EEF9]">
                            ${previewHtml}
                        </div>
                        <div class="p-4 flex items-center justify-between bg-white gap-2">
                            <span class="text-[#4A3324] font-semibold truncate text-base flex-grow" title="${file.name}">${file.name}</span>
                            <div class="flex items-center gap-1">
                                <!-- Отдельная кнопка: Изменить имя файла -->
                                <button onclick="editFile(${file.id}, event)" class="flex items-center gap-1 text-xs bg-blue-50 hover:bg-blue-100 text-[#1E56A0] font-semibold px-2.5 py-1.5 rounded-lg transition border border-blue-200" title="Изменить имя файла">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                    <span>Имя</span>
                                </button>
                                <button onclick="deleteFile(${file.id}, event)" class="text-stone-400 hover:text-red-600 p-2 rounded-lg transition" title="Удалить файл">
                                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function openFolder(folderId, folderName) {
            currentFolderId = folderId;
            searchQuery = '';
            document.getElementById('search-input').value = '';
            render();
        }

        function goHome() {
            currentFolderId = null;
            searchQuery = '';
            document.getElementById('search-input').value = '';
            render();
        }

        function handleSearch(query) {
            searchQuery = query;
            if (query.trim() !== '' && currentFolderId !== null) {
                currentFolderId = null;
            }
            render();
        }

        function openMedia(type, url, name) {
            const modal = document.getElementById('media-modal');
            const container = document.getElementById('media-container');
            const titleEl = document.getElementById('media-title');
            container.innerHTML = '';
            titleEl.innerText = name;

            if (type === 'image') {
                container.innerHTML = `<img src="${url}" class="max-h-[80vh] max-w-full object-contain rounded-xl shadow-2xl">`;
            } else if (type === 'video') {
                container.innerHTML = `<video src="${url}" controls autoplay class="max-h-[80vh] max-w-full rounded-xl shadow-2xl"></video>`;
            } else if (type === 'audio') {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl flex flex-col items-center shadow-2xl border border-purple-200">
                        <div class="bg-[#4A3575] text-white p-6 rounded-full mb-6">
                            <svg class="w-16 h-16 fill-current" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        </div>
                        <audio src="${url}" controls autoplay class="w-80"></audio>
                    </div>`;
            }

            modal.classList.remove('hidden');
        }

        function closeMediaModal() {
            const modal = document.getElementById('media-modal');
            const container = document.getElementById('media-container');
            modal.classList.add('hidden');
            container.innerHTML = '';
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                await loadData();
            } catch (err) {
                console.error("Ошибка инициализации IndexedDB:", err);
                alert("Не удалось запустить локальную базу данных в браузере.");
            }
        });
    </script>
</body>
</html>
